<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trafforge recruiting</title>
<script>try{var t=localStorage.getItem("ct-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Saira+Semi+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
/* Trafforge recruiting – design tokens */
:root{
  --bg:#FAFAFA;--surface:#FFFFFF;--surface-2:#F4F4F5;--hover:#F7F7F8;--ink:#09090B;--ink-2:#3F3F46;--muted:#71717A;--faint:#A1A1AA;--line:#EBEBED;--line-2:#DEDEE2;
  --side:#F7F7F8;--side-2:#EDEDEF;--side-line:#EBEBED;--side-ink:#09090B;--side-muted:#71717A;
  --brand:#FF0000;--btn:#D80000;--btn-hover:#BC0000;--accent:#C40000;--ring:rgba(216,0,0,.18);
  --late:#D40000;--due:#B45309;--ok:#15803D;--info:#2563EB;
  --av-l:92%;--av-tl:32%;--av-s:55%;
  --shadow-sm:0 1px 2px rgba(9,9,11,.04);--shadow-lg:0 16px 48px rgba(9,9,11,.16);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#09090B;--surface:#0E0E10;--surface-2:#17171A;--hover:#131316;--ink:#EDEDEF;--ink-2:#C4C4CC;--muted:#8B8B94;--faint:#5C5C66;--line:#1E1E22;--line-2:#2A2A30;
    --side:#060607;--side-2:#141417;--side-line:#1A1A1E;--side-ink:#EDEDEF;--side-muted:#8B8B94;
    --btn:#E00000;--btn-hover:#FF1A1A;--accent:#FF4D4D;--ring:rgba(255,40,40,.25);
    --late:#FF5C5C;--due:#F0B44C;--ok:#4ADE80;--info:#60A5FA;
    --av-l:22%;--av-tl:78%;--av-s:38%;
    --shadow-sm:none;--shadow-lg:0 16px 48px rgba(0,0,0,.6);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09090B;--surface:#0E0E10;--surface-2:#17171A;--hover:#131316;--ink:#EDEDEF;--ink-2:#C4C4CC;--muted:#8B8B94;--faint:#5C5C66;--line:#1E1E22;--line-2:#2A2A30;
  --side:#060607;--side-2:#141417;--side-line:#1A1A1E;--side-ink:#EDEDEF;--side-muted:#8B8B94;
  --btn:#E00000;--btn-hover:#FF1A1A;--accent:#FF4D4D;--ring:rgba(255,40,40,.25);
  --late:#FF5C5C;--due:#F0B44C;--ok:#4ADE80;--info:#60A5FA;
  --av-l:22%;--av-tl:78%;--av-s:38%;
  --shadow-sm:none;--shadow-lg:0 16px 48px rgba(0,0,0,.6);color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Geist","Inter var",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--ring)}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;border-right:1px solid var(--side-line);padding:16px 10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--side-ink);padding:6px 10px 22px}
.brand svg{width:24px;height:24px;flex:none}
.wm{font-family:"Saira Semi Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:15px;letter-spacing:.32em;line-height:1}
.side-label{font-size:11.5px;font-weight:500;color:var(--side-muted);margin:0 10px 6px}
.tabs{display:flex;flex-direction:column;gap:1px}
.tabs a{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:6px;color:var(--side-muted);text-decoration:none;font-weight:500;font-size:13.5px}
.tabs a svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs a:hover{color:var(--side-ink);background:var(--side-2)}
.tabs a[aria-current="page"]{color:var(--side-ink);background:var(--side-2)}
.tabs a[aria-current="page"] svg{color:var(--brand)}
.tabs .count{margin-left:auto;min-width:18px;padding:0 5px;border-radius:5px;background:var(--brand);color:#fff;font-size:11px;font-weight:600;text-align:center;line-height:18px;font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;padding:12px 10px 2px;border-top:1px solid var(--side-line)}
.summary{margin:0;color:var(--side-muted);font-size:12px;line-height:1.7}
.summary b{font-weight:600}
.summary .l{color:var(--late)} .summary .d{color:var(--due)}
.demo-tag{align-self:flex-start;margin:-10px 10px 16px;font-size:11px;font-weight:600;color:var(--due);border:1px solid currentColor;padding:1px 7px;border-radius:5px}
.content{min-width:0;display:flex;flex-direction:column}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px 32px 18px;border-bottom:1px solid var(--line);margin-bottom:22px;background:var(--bg)}
.pagehead h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.015em;line-height:1.3}
.pagehead .sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.hbtns{display:flex;gap:8px;align-items:center}
main{padding:0 32px 64px;width:100%;max-width:1320px}
main.narrow > *{max-width:1080px}
.notice{margin:0 32px 16px;padding:9px 12px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--due);font-size:13px;max-width:1080px}
@media (max-width:900px){
  .shell{display:block}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:5;flex-direction:row;align-items:center;flex-wrap:wrap;padding:8px 10px 0;gap:2px 10px;border-right:0;border-bottom:1px solid var(--side-line)}
  .brand{padding:6px 6px 8px}
  .side-label,.side-foot{display:none}
  .demo-tag{margin:0}
  .tabs{flex-direction:row;overflow-x:auto;width:100%;gap:0}
  .tabs a{white-space:nowrap;border-radius:0;height:38px;background:none!important;border-bottom:2px solid transparent}
  .tabs a svg{display:none}
  .tabs a[aria-current="page"]{border-color:var(--brand)}
  .pagehead{padding:16px;margin-bottom:16px}
  main{padding:0 16px 48px}
  .notice{margin:0 16px 12px}
}

/* ---------- controls ---------- */
.btn{height:32px;border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:0 12px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:var(--shadow-sm);transition:background .12s,border-color .12s,color .12s}
.btn:hover{background:var(--hover);border-color:var(--faint)}
.btn.primary{background:var(--btn);border-color:var(--btn);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.12) inset}
.btn.primary:hover{background:var(--btn-hover);border-color:var(--btn-hover)}
.btn.danger{color:var(--late)}
.btn.danger:hover{border-color:var(--late)}
.btn.small{height:28px;padding:0 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg,.ib svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:7px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;text-decoration:none}
.ib:hover{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.ib.bordered{border-color:var(--line-2);background:var(--surface)}
.ib.bordered:hover{background:var(--hover)}
.theme-ico .moon{display:none}
:root[data-theme="dark"] .theme-ico .sun{display:none}:root[data-theme="dark"] .theme-ico .moon{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .theme-ico .sun{display:none}:root:not([data-theme="light"]) .theme-ico .moon{display:block}}
input[type=text],input[type=email],input[type=date],input[type=search],input[type=url],input[type=tel],select,textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:0 10px;height:34px;font-size:13.5px;width:100%;transition:border-color .12s,box-shadow .12s;color:var(--ink)}
textarea{height:auto;padding:8px 10px;resize:vertical;min-height:80px;line-height:1.55}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;align-items:center}
.filters input,.filters select{width:auto;flex:1 1 170px;min-width:0}
.filters input[type=search]{flex:2 1 220px}
.spacer{flex:1}
.tip{font-size:12.5px;color:var(--muted)}
/* segmented control */
.chips{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;overflow-x:auto;max-width:100%;margin:0 0 14px}
.chip{border:0;background:none;border-radius:6px;height:28px;padding:0 10px;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--muted);display:inline-flex;align-items:center}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.chip .c{color:var(--faint);margin-left:6px;font-variant-numeric:tabular-nums}
.toggle{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;height:32px;padding:0 10px;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.toggle::before{content:"";width:12px;height:12px;border-radius:3px;border:1.5px solid var(--faint)}
.toggle[aria-pressed="true"]{color:var(--ink)}
.toggle[aria-pressed="true"]::before{background:var(--btn);border-color:var(--btn);box-shadow:inset 0 0 0 2px var(--surface)}

/* ---------- status ---------- */
.stage{--dot:#A1A1AA;display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);font-size:12.5px;font-weight:500;white-space:nowrap}
.stage::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 3px color-mix(in srgb,var(--dot) 18%,transparent)}
.stage[data-s="Screening"]{--dot:#3B82F6}.stage[data-s="Technical interview"]{--dot:#8B5CF6}.stage[data-s="Second interview"]{--dot:#6366F1}.stage[data-s="Offer"]{--dot:#F59E0B}.stage[data-s="Hired"]{--dot:#22C55E}.stage[data-s="Rejected"]{--dot:#EF4444}.stage[data-s="Withdrawn"]{--dot:#71717A}
.flag{font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.flag.late{color:var(--late);font-weight:600}
.flag.due{color:var(--due);font-weight:600}
.flag.ok{color:var(--muted)}
.flag.none{color:var(--faint)}

/* ---------- avatars ---------- */
.av{--h:0;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:hsl(var(--h) var(--av-s) var(--av-l));color:hsl(var(--h) 60% var(--av-tl));font-size:11px;font-weight:600;flex:none;letter-spacing:.01em;line-height:1}
.av.sm{width:22px;height:22px;font-size:9.5px}
.av.lg{width:44px;height:44px;font-size:15px}
.av.av-none{background:transparent;border:1px dashed var(--faint);color:var(--faint)}
.namecell{display:inline-flex;align-items:center;gap:10px;white-space:nowrap}
.owner-chip{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);min-width:0}

/* ---------- stats ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:0 0 24px;overflow:hidden;box-shadow:var(--shadow-sm)}
.kpi{padding:14px 18px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi .k{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi .v{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.25;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi.k-alert .v{color:var(--late)} .kpi.k-warn .v{color:var(--due)}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}

/* ---------- grouped list ---------- */
.dlist{--cols:minmax(220px,2.4fr) 150px minmax(150px,1.6fr) 150px 130px 72px;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow-sm)}
.dl-head,.row{display:grid;grid-template-columns:var(--cols);align-items:center;column-gap:16px;padding:0 14px}
.dl-head{height:34px;font-size:12px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);background:var(--surface-2)}
.grp{display:flex;align-items:baseline;gap:8px;padding:14px 14px 6px;border-top:1px solid var(--line);font-size:12.5px;font-weight:600}
.dl-head + .grp{border-top:0}
.grp .n{color:var(--faint);font-weight:500;font-variant-numeric:tabular-nums}
.grp .hint{color:var(--muted);font-weight:400;margin-left:4px}
.grp.late{color:var(--late)} .grp.due{color:var(--due)}
.row{min-height:52px;position:relative;border-top:1px solid transparent}
.grp + .row{border-top-color:transparent}
.row + .row{border-top-color:var(--line)}
.row:hover{background:var(--hover)}
.who{display:flex;align-items:center;gap:11px;min-width:0;background:none;border:0;padding:8px 0;cursor:pointer;text-align:left;color:inherit}
.who-t{display:flex;flex-direction:column;min-width:0}
.who-t b{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-t span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who:hover b{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.cell{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--ink-2)}
.cell.muted{color:var(--faint)}
.r-acts{display:flex;justify-content:flex-end;gap:2px;opacity:.55;transition:opacity .12s}
.row:hover .r-acts,.r-acts:focus-within{opacity:1}
@media (max-width:900px){
  .dlist{--cols:minmax(0,1fr) auto}
  .dl-head{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;row-gap:2px;padding:8px 14px}
  .row .c-stage,.row .c-role,.row .c-owner{display:none}
  .row .c-due{grid-column:2;grid-row:1;text-align:right}
  .row .r-acts{grid-column:2;grid-row:2;justify-content:flex-end;opacity:1;margin-top:-6px}
  .row .who{padding:4px 0}
}
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:10px;padding:44px 20px;text-align:center}
.empty h2{margin:0 0 6px;font-size:15px;font-weight:600}
.empty p{margin:0 0 18px;color:var(--muted)}
.empty .btn{margin:0 3px}
.clear{display:flex;align-items:center;gap:8px;color:var(--ok);font-weight:500;margin:0 0 18px;font-size:13px}
.clear::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}

/* ---------- board ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{display:flex;flex-direction:column;min-height:240px;max-height:calc(100vh - 230px);border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 8px}
.col-h .stage{font-weight:600;color:var(--ink);font-size:12.5px}
.col-h .n{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.col-body{padding:2px 8px 8px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;flex:1;border-radius:0 0 10px 10px;transition:background .12s}
.col-body.over{background:color-mix(in srgb,var(--btn) 7%,transparent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.col-empty{margin:2px;font-size:12.5px;color:var(--faint);padding:16px 8px;text-align:center}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;color:inherit;font:inherit;box-shadow:var(--shadow-sm);transition:border-color .12s,transform .12s}
.kcard:hover{border-color:var(--line-2)}
.kcard.late{border-left:2px solid var(--late)}
.kcard.due{border-left:2px solid var(--due)}
.kcard.dragging{opacity:.4;transform:rotate(1deg)}
.kcard[draggable="true"]{cursor:grab}
.k-top{display:flex;gap:9px;align-items:center;min-width:0}
.k-name{min-width:0;display:flex;flex-direction:column}
.k-name b{font-weight:600;font-size:13px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-name span,.k-role{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.k-foot .flag{font-size:12px}
.board-hint{font-size:12px;color:var(--faint);margin:10px 0 0}
@media (max-width:900px){.board{grid-auto-columns:84vw;scroll-snap-type:x mandatory}.col{scroll-snap-align:start;max-height:none}}

/* ---------- table ---------- */
.tbl-wrap{overflow:auto;max-height:calc(100vh - 270px);min-height:240px;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--shadow-sm)}
table.grid{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.grid th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:0;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.grid th button{background:none;border:0;height:34px;padding:0 12px;font-weight:500;cursor:pointer;width:100%;text-align:left;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
.grid th button::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--gc,transparent);flex:none}
.grid th[aria-sort="ascending"] button,.grid th[aria-sort="descending"] button{color:var(--ink)}
.grid th.gp{--gc:var(--brand)} .grid th.gs{--gc:#3B82F6} .grid th.gi{--gc:#F59E0B} .grid th.gc{--gc:transparent}
.grid td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;max-width:300px;overflow-wrap:anywhere;color:var(--ink-2)}
.grid tbody tr:last-child td{border-bottom:0}
.grid td.nowrap{white-space:nowrap;overflow-wrap:normal;max-width:none}
.grid td.wide{min-width:220px}
.grid td.mid{min-width:180px}
.grid .na{color:var(--faint)}
.grid tbody tr{cursor:pointer}
.grid tbody tr:hover td{background:var(--hover)}
.grid th:first-child{left:0;z-index:3}
.grid td:first-child{position:sticky;left:0;background:var(--surface);z-index:2;font-weight:600;color:var(--ink);min-width:200px;box-shadow:1px 0 0 var(--line)}
.grid a{color:var(--accent);font-weight:500;text-decoration:none}
.grid a:hover{text-decoration:underline}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 0 0;align-items:center}
.legend span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:6px;vertical-align:1px;background:var(--c)}
.legend span.plain{color:var(--faint)}
.legend span.plain::before{display:none}

/* ---------- drawer ---------- */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(9,9,11,.45);display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.sheet{display:flex;flex-direction:column;background:var(--surface);width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:14px 14px 0 0;padding:20px 22px calc(16px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);box-shadow:var(--shadow-lg)}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:14px;padding-bottom:16px}}
@media (min-width:900px){.overlay{justify-content:flex-end;align-items:stretch;background:rgba(9,9,11,.32)}.sheet{max-width:720px;height:100%;max-height:none;border-radius:0;border-width:0 0 0 1px;padding:22px 28px 16px}
  @media (prefers-reduced-motion:no-preference){.overlay .sheet{animation:slidein .18s cubic-bezier(.2,.8,.2,1)}@keyframes slidein{from{transform:translateX(20px);opacity:.5}to{transform:none;opacity:1}}}}
.sheet h2{margin:0 0 12px;font-size:17px;font-weight:600;letter-spacing:-.01em}
.dh{display:flex;align-items:center;gap:14px;margin:0 0 18px;padding-right:40px;position:relative}
.dh h2{margin:0}
.dh-sub{margin:3px 0 0;display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.xbtn{position:absolute;right:-6px;top:-2px;width:32px;height:32px;border-radius:7px;border:1px solid transparent;background:none;font-size:20px;line-height:1;color:var(--muted);cursor:pointer}
.xbtn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.stabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:0 0 18px;overflow-x:auto}
.stabs button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 0 10px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;font-size:13px;margin-bottom:-1px}
.stabs button:hover{color:var(--ink)}
.stabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.panel{padding-bottom:14px}
.panel[hidden],[hidden]{display:none!important}
.field{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.field label{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
.sheet > *{flex-shrink:0}
.sheet > form{flex:1 0 auto;display:flex;flex-direction:column}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:auto;position:sticky;bottom:-16px;background:var(--surface);padding:12px 0 4px;border-top:1px solid var(--line)}
.resume-box{border:1px dashed var(--line-2);border-radius:10px;padding:14px 16px;margin:0 0 20px;background:var(--surface-2)}
.resume-box h3{margin:0 0 3px;font-size:13.5px;font-weight:600}
.resume-box .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px;padding:0;min-height:0;border:0}
.resume-box .row:hover{background:none}
.resume-box input[type=file]{font-size:12.5px;max-width:100%;height:auto;border:0;padding:0;background:none}
.status{font-size:13px;margin:10px 0 0;color:var(--muted)}
.status.ok{color:var(--ok)} .status.err{color:var(--late)}
.status b{font-weight:600}
input.af-ok,textarea.af-ok{border-color:color-mix(in srgb,var(--ok) 70%,var(--line-2));box-shadow:inset 2px 0 0 var(--ok)}
input.af-miss,textarea.af-miss{border-color:color-mix(in srgb,var(--due) 70%,var(--line-2));box-shadow:inset 2px 0 0 var(--due)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:500;cursor:pointer;font-size:13px}
.inlink{font-weight:500;color:var(--accent);margin-left:8px;text-decoration:none}
.history ol{list-style:none;margin:0;padding:0 0 0 14px;display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--line)}
.history li{font-size:13px;display:flex;flex-direction:column;gap:1px;position:relative}
.history li::before{content:"";position:absolute;left:-18px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--surface);border:1.5px solid var(--faint)}
.history time{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.iv{border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin:0 0 10px;font-size:13px}
.iv-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.iv h4{margin:0;font-size:13.5px;font-weight:600}
.iv p{margin:5px 0 0;color:var(--ink-2)}
.iv .muted{color:var(--muted)}
.rec{font-weight:600;font-size:12px}
.rec.pos{color:var(--ok)} .rec.neg{color:var(--late)}
.ivform{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:14px}
.ivform h3{margin:0 0 12px;font-size:13.5px;font-weight:600}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.check input{margin-top:3px;accent-color:var(--btn)}
.imp-sum{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;margin:0 0 12px}
.imp-sum.err{color:var(--late)}
.imp-sum ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}

/* ---------- templates ---------- */
.compose{display:grid;grid-template-columns:280px minmax(0,1fr);grid-template-areas:"cand prev" "tpls prev" "sign prev";gap:16px 24px;align-items:start;max-width:1080px}
.compose .f-cand{grid-area:cand;margin:0}.compose .f-tpl{grid-area:tpls;margin:0}.compose .preview{grid-area:prev}.compose .sign{grid-area:sign}
@media (max-width:900px){.compose{grid-template-columns:1fr;grid-template-areas:"cand" "tpls" "prev" "sign"}}
.tpl-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.tpl-list .chip{height:auto;min-height:36px;padding:8px 12px;border-radius:0;justify-content:space-between;font-size:13px;color:var(--ink-2);border-top:1px solid var(--line);box-shadow:none;text-align:left}
.tpl-list .chip:first-child{border-top:0}
.tpl-list .chip:hover{background:var(--hover)}
.tpl-list .chip[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);font-weight:600;box-shadow:inset 2px 0 0 var(--btn)}
.tpl-list .chip .sug{font-size:11px;font-weight:500;color:var(--accent);margin-left:8px}
.preview,.sign{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:var(--shadow-sm)}
.preview textarea{min-height:340px}
.sign h3{margin:0 0 10px;font-size:13.5px;font-weight:600}
.warn{color:var(--due);font-size:12.5px;margin:6px 0 0}
.dropzone{position:fixed;inset:12px;z-index:40;border:2px dashed var(--accent);border-radius:16px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(3px);display:grid;place-items:center;pointer-events:none}
.dropzone div{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--ink)}
.dropzone b{font-size:16px;font-weight:600}
.dropzone span{color:var(--muted);font-size:13px}
.dropzone svg{width:30px;height:30px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-bottom:6px}
.up-list{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:4px 0 10px}
.up-row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.up-row:first-child{border-top:0}
.up-row.off{opacity:.55}
.up-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--btn);margin:0}
.up-name{height:30px!important;font-weight:500}
.up-name.need{border-color:var(--late)!important}
.up-meta{display:flex;gap:2px 12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:5px}
.up-meta .f{color:var(--faint)}
.up-stat{font-size:12px;font-weight:500;white-space:nowrap;text-align:right;color:var(--muted)}
.up-stat.ok{color:var(--ok)} .up-stat.warn{color:var(--due)} .up-stat.err{color:var(--late)}
.up-stat.busy::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:50%;border:1.5px solid var(--line-2);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:560px){.up-row{grid-template-columns:18px minmax(0,1fr)}.up-stat{grid-column:2;text-align:left}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:500;font-size:13px;z-index:30;max-width:calc(100% - 32px);box-shadow:var(--shadow-lg)}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
  <a class="brand" href="#today" aria-label="Trafforge candidate tracker"><svg viewBox="19 19 160 160" aria-hidden="true"><path fill="var(--brand)" d="M173 67L99 24L25 67V115L41 124V77L99 43L157 77V124L173 115Z M107 66V163L127 175L173 148V130L124 158L123 76Z M91 66V163L71 175L25 148V130L74 158L75 76Z"/></svg><span class="wm">TRAFFORGE</span></a>
  <!--DEMO-->
  <p class="side-label">Recruiting</p>
  <nav class="tabs" aria-label="Views">
    <a href="#today" data-view="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Follow up<span class="count" id="dueCount" hidden></span></a>
    <a href="#pipeline" data-view="pipeline"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>Pipeline</a>
    <a href="#table" data-view="table"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>Candidates</a>
    <a href="#templates" data-view="templates"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>Email templates</a>
  </nav>
  <div class="side-foot"><p class="summary" id="summary">Loading candidates…</p></div>
</aside>
<div class="content">
  <header class="pagehead"><div><h1 id="pageTitle">Follow up</h1><p class="sub" id="pageSub"></p></div>
    <div class="hbtns"><button class="ib bordered theme-ico" id="themeBtn" type="button" aria-label="Switch theme" title="Switch between light and dark mode"><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button><button class="btn" id="impBtn" data-act="import" title="Import a CSV or spreadsheet"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>Import CSV</button><button class="btn" id="addBtn" data-act="add" title="Type in a candidate by hand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add manually</button><button class="btn primary" id="upBtn" data-act="upload" title="Upload one or more resumes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M5 15v4h14v-4"/></svg>Upload resumes</button><input type="file" id="bulkFile" multiple accept=".pdf,.docx,.txt,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain" hidden></div></header>
  <div class="notice" id="notice" hidden></div>
  <main id="main"></main>
</div>
</div>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<div class="dropzone" id="dropzone" hidden><div><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M5 15v4h14v-4"/></svg><b>Drop resumes to add them</b><span>PDF, Word (.docx) or text files, up to 25 at a time</span></div></div>

<script>
(function(){
"use strict";
/* ---------- process definition ---------- */
const STAGES=["Applied","Screening","Technical interview","Second interview","Offer","Hired","Rejected","Withdrawn"];
const OPEN=["Applied","Screening","Technical interview","Second interview","Offer"];
const LEGACY={"Interview":"Technical interview","Final review":"Second interview"};
const SLA={"Applied":5,"Screening":3,"Technical interview":3,"Second interview":3,"Offer":3};
const PROFILE=[["title","Current job title"],["company","Current company"],["years","Years of experience"],["skills","Key skills"],["education","Education"],["certs","Certifications"],["location","Current location"]];
const SCREEN=[["salary","Salary expectation"],["auth","Work authorization"],["workLocation","Location"],["relocate","Willing to relocate?"],["notice","Notice period"],["availability","Availability"]];
const IV_TYPES=["Technical interview","Second interview"];
const RECS=["Strong hire","Hire","No hire","Strong no hire"];
const SUGGEST={"Applied":["A","B","G"],"Screening":["C","G"],"Technical interview":["I","D","H"],"Second interview":["D","E","F","H"],"Offer":["F"],"Rejected":["G","H"]};
const TEMPLATES=[
{id:"A",name:"Application received",subject:"We’ve received your application for {role}",body:"Hi {first},\n\nThank you for applying for the {role} position at {company}. We’ve received your application and our team will review it carefully.\n\nYou can expect to hear from us by {due}. If you have any questions in the meantime, just reply to this email.\n\nBest regards,\n{me}\n{title}, {company}"},
{id:"B",name:"Screening call invite",subject:"Next step for the {role} role at {company}",body:"Hi {first},\n\nThanks again for your interest in {role}. We enjoyed reading your application and would like to set up a 20–30 minute call to learn more about you and share more about the role.\n\nPlease pick a time that suits you here: [scheduling link]. If none of these work, reply with a few times and we’ll make it fit.\n\nLooking forward to speaking with you,\n{me}\n{title}, {company}"},
{id:"C",name:"Technical interview invite",subject:"Technical interview for {role} at {company}",body:"Hi {first},\n\nThank you for the conversation on [date]. We’d like to invite you to a technical interview for the {role} position.\n\nFormat: [video / on-site at address], about [length]\nYou’ll meet: [names and roles]\nWhat to expect: [e.g. a discussion of systems you’ve built and a hands-on problem]\n\nPlease choose a time here: [scheduling link]. If you need any adjustments to make the interview accessible, let us know.\n\nBest regards,\n{me}\n{title}, {company}"},
{id:"I",name:"Second interview invite",subject:"Next interview for {role} at {company}",body:"Hi {first},\n\nThank you for your technical interview with [names]. The team enjoyed it, and we’d like to invite you to a second interview.\n\nFormat: [video / on-site at address], about [length]\nYou’ll meet: [names and roles]\nWhat to expect: [e.g. a conversation about the client team, ways of working and your goals]\n\nPlease choose a time here: [scheduling link].\n\nBest regards,\n{me}\n{title}, {company}"},
{id:"D",name:"Thank you after interview",subject:"Thank you for interviewing with us",body:"Hi {first},\n\nThank you for taking the time to meet with [names] on [day]. We appreciated the conversation about [one specific topic].\n\nWe’re completing our interviews and expect to share an update by {due}. Feel free to reach out if you have any questions.\n\nBest,\n{me}\n{title}, {company}"},
{id:"E",name:"Status update (delay)",subject:"An update on your {role} application",body:"Hi {first},\n\nI wanted to give you a quick update: we’re still finalizing our decision for the {role} position and it’s taking a little longer than planned. You remain very much in consideration.\n\nWe expect to have an answer for you by {due}. Thank you for your patience.\n\nBest regards,\n{me}\n{title}, {company}"},
{id:"F",name:"Offer",subject:"Your offer from {company}",body:"Hi {first},\n\nFollowing our call, I’m delighted to confirm our offer for the {role} position. Your formal offer letter is attached, covering salary, start date and benefits.\n\nPlease review it and let us know your decision by {due}. If you have questions or would like to talk anything through, I’m happy to set up a call.\n\nWe’re excited about the possibility of you joining the team.\n\nWarm regards,\n{me}\n{title}, {company}"},
{id:"G",name:"Rejection before interviews",subject:"Your application for {role} at {company}",body:"Hi {first},\n\nThank you for your interest in the {role} position and for the time you put into your application.\n\nAfter careful review, we’ve decided to move forward with other candidates whose experience more closely matches what we need for this role. This was not an easy decision.\n\nWe’d be glad to keep your details on file for future openings, and we wish you every success in your search.\n\nKind regards,\n{me}\n{title}, {company}"},
{id:"H",name:"Rejection after interviews",subject:"Your interview for {role} at {company}",body:"Hi {first},\n\nThank you for the time and energy you invested in interviewing with us, and for the thoughtful conversations with [names].\n\nAfter much consideration, we’ve decided to offer the position to another candidate. We were impressed by [one specific strength], and this decision reflects the needs of this particular role rather than a lack of ability.\n\nIf you’d find it helpful, I’m happy to share brief feedback on a short call. We’d also welcome hearing from you about future openings.\n\nWith best wishes,\n{me}\n{title}, {company}"}
];

/* ---------- dates & helpers ---------- */
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])}
function today(){return iso(new Date())}
function addBiz(n){const d=new Date();d.setHours(0,0,0,0);let k=0;while(k<n){d.setDate(d.getDate()+1);const w=d.getDay();if(w!==0&&w!==6)k++}return iso(d)}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function fmt(s){if(!s)return "";return parse(s).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}
function fmtShort(s){if(!s||!/^\d{4}-\d\d-\d\d$/.test(s))return s||"";return parse(s).toLocaleDateString(undefined,{month:"short",day:"numeric"})}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uid(){return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function na(v){v=v==null?"":String(v).trim();return v&&v.toUpperCase()!=="N/A"?v:""}
function isUrl(v){return /^https?:\/\/\S+$/i.test(v||"")}
const $=s=>document.querySelector(s);
let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}
function notice(msg){const n=$("#notice");if(!msg){n.hidden=true;return}n.textContent=msg;n.hidden=false}
const scriptCache={};
function loadScript(src){return scriptCache[src]||(scriptCache[src]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>{delete scriptCache[src];rej(new Error("load"))};document.head.appendChild(s)}))}

/* ---------- state ---------- */
let candidates=[];let settings={company:""};let loaded=false;let canWrite=true;let store=null;
let assetsApi=null,downloadsApi=null;
let view="today";
const pf={stage:"open",role:"",owner:"",q:""};
const tf={stage:"open",q:"",groups:{profile:true,screen:true,interviews:true},sort:"name",dir:1};
const cs={cid:"",tpl:""};
const me={name:ls("ct-name")||"",title:ls("ct-title")||""};

/* ---------- stores ---------- */
function makeDbStore(db){
  const col=db.collection("candidates");const sdoc=db.doc("settings/main");
  return{shared:true,
    subscribe(cb,onErr){col.onSnapshot(s=>cb(s.docs.map(d=>Object.assign({id:d.id},d.data())),s.metadata),onErr);
      sdoc.onSnapshot(s=>{settings=Object.assign({company:""},s.exists?s.data():{});if(view==="templates")render()},()=>{})},
    async save(c){const o=JSON.parse(JSON.stringify(c));delete o.id;await col.doc(c.id).set(o)},
    async remove(id){await col.doc(id).delete()},
    async saveSettings(s){await sdoc.set(s)}};
}
function makeLocalStore(){
  let cb=null;
  const read=()=>{try{return JSON.parse(ls("ct-local")||"[]")}catch(e){return[]}};
  const write=a=>{ls("ct-local",JSON.stringify(a));cb&&cb(a,{fromCache:false})};
  return{shared:false,
    subscribe(f){cb=f;try{settings=Object.assign({company:""},JSON.parse(ls("ct-settings")||"{}"))}catch(e){}f(read(),{fromCache:false})},
    async save(c){const a=read().filter(x=>x.id!==c.id);a.push(JSON.parse(JSON.stringify(c)));write(a)},
    async remove(id){write(read().filter(x=>x.id!==id))},
    async saveSettings(s){ls("ct-settings",JSON.stringify(s));settings=s;render()}};
}
async function persist(fn,okMsg){
  try{await fn();if(okMsg)toast(okMsg);return true}
  catch(e){
    if(e&&e.code==="invalid_argument"&&store.shared){canWrite=false;render();toast("You have view-only access to this tracker.")}
    else if(e&&e.code==="quota_exceeded")toast("The tracker is full. Delete closed candidates to make room.");
    else toast("Couldn’t save. Check your connection and try again.");
    return false;
  }
}

/* ---------- avatars ---------- */
const AVC=["#B91C1C","#6D28D9","#1D4ED8","#0E7490","#047857","#B45309","#BE185D","#4338CA","#334155"];
function initials(n){const p=String(n||"").trim().split(/\s+/).filter(Boolean);return ((p[0]||"?")[0]+(p.length>1?p[p.length-1][0]:"")).toUpperCase()}
const HUES=[0,214,262,190,152,32,330,240,200,280];
function avatar(n,size){let h=0;for(const ch of String(n||""))h=(h*31+ch.charCodeAt(0))>>>0;return `<span class="av${size?" "+size:""}" style="--h:${HUES[h%HUES.length]}" aria-hidden="true">${esc(initials(n))}</span>`}

/* ---------- derived ---------- */
function isOpen(c){return OPEN.includes(c.stage)}
function normalize(c){c.stage=LEGACY[c.stage]||c.stage||"Applied";c.profile=c.profile||{};c.screen=c.screen||{};c.interviews=Array.isArray(c.interviews)?c.interviews:[];c.history=Array.isArray(c.history)?c.history:[];return c}
function buckets(){
  const t=today(),soon=addBiz(5);const open=candidates.filter(isOpen);
  const by=(a,b)=>(a.next||"").localeCompare(b.next||"")||a.name.localeCompare(b.name);

  if(!li&&/linkedin/i.test(text))notes.push("The resume mentions LinkedIn but the link itself couldn’t be read.");
  if(!sections.experience)notes.push("No “Experience” section was recognized, so job title and company are guesses.");
  for(const k in r)if(!r[k])r[k]="N/A";
  return{fields:r,found,notes,hasSections:!!(sections.experience||sections.education||sections.skills)};
}
return{parse};
})();

/* ---------- import ---------- */
function parseCSV(text){
  const firstLine=text.split(/\r?\n/)[0]||"";
  const delim=firstLine.includes("\t")&&!firstLine.includes(",")?"\t":",";
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"'&&f==="")q=true;
    else if(ch===delim){row.push(f);f=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}
    else f+=ch}
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
const HEAD={name:["name","full name","full_name","candidate","candidate name"],first:["first name","first_name","firstname","given name"],last:["last name","last_name","lastname","surname","family name"],
  email:["email","email address","e-mail","email_address"],phone:["phone","phone number","mobile","phone_number"],linkedin:["linkedin","linkedin url","linkedin_url","linkedin profile","profile url"],
  role:["role","job","job title","job_title","position","applied for","applied_for"],source:["source"],notes:["notes","cover note","cover_note","message","comments"],resume:["resume","resume url","resume_url","cv","cv url"],
  title:["current job title","current_job_title","current title","current_title"],company:["current company","current_company","employer","company"],years:["years of experience","years_of_experience","experience","years"],
  skills:["key skills","key_skills","skills"],education:["education"],certs:["certifications","certs","certification"],location:["location","current location","current_location","city"],
  salary:["salary expectation","salary_expectation","salary"],auth:["work_authorization","work authorization"],relocate:["willing to relocate","willing_to_relocate","relocate"],notice:["notice period","notice_period"],availability:["availability"]};
function mapRows(text,defRole,defSource,ackSent){
  const rows=parseCSV(text);
  if(rows.length<2)return{error:"Add a header row and at least one candidate below it."};
  const hdr=rows[0].map(h=>h.replace(/^\ufeff/,"").trim().toLowerCase().replace(/\s+/g," "));
  const idx={};for(const k in HEAD)idx[k]=hdr.findIndex(h=>HEAD[k].includes(h));
  if(idx.name<0&&idx.first<0)return{error:"Couldn’t find a name column. Use a header called “name”, or “first_name” and “last_name”."};
  const known=new Set(candidates.map(c=>(c.email||"").toLowerCase()).filter(Boolean));
  const seen=new Set();const fresh=[],dupes=[];let blank=0;
  const get=(r,k)=>idx[k]>=0?na(r[idx[k]]):"";
  const next=ackSent?addBiz(SLA.Applied):addBiz(1);
  for(const r of rows.slice(1,301)){
    const name=get(r,"name")||[get(r,"first"),get(r,"last")].filter(Boolean).join(" ");
    if(!name){blank++;continue}
    const email=get(r,"email");const key=email.toLowerCase();
    if(key&&(known.has(key)||seen.has(key))){dupes.push(name);continue}
    if(key)seen.add(key);
    const source=get(r,"source")||defSource;
    const notes=[get(r,"resume")&&"Resume link: "+get(r,"resume"),get(r,"notes")].filter(Boolean).join("\n");
    fresh.push({id:uid(),name,email,phone:get(r,"phone"),linkedin:get(r,"linkedin"),role:get(r,"role")||defRole,stage:"Applied",owner:"",source,next,notes,
      profile:Object.fromEntries(PROFILE.map(([k])=>[k,get(r,k)])),screen:Object.fromEntries(SCREEN.map(([k])=>[k,get(r,k==="workLocation"?"__none":k)])),interviews:[],
      history:[{d:today(),t:"Imported"+(source?" from "+source:"")+(ackSent?", acknowledgement already sent":"")}]});
  }
  return{fresh,dupes,blank,over:rows.length-1>300};
}

  <div class="field"><label for="ifile">CSV file</label><input type="file" id="ifile" accept=".csv,.tsv,.txt,text/csv"></div>

    <div class="field"><label for="isource">Source, if the file has none</label><input type="text" id="isource" value="Careers page"></div>
  </div>
  <div class="field"><label class="check"><input type="checkbox" id="iack" checked><span>Acknowledgement emails were already sent automatically (sets the first follow-up 5 business days out instead of 1)</span></label></div>
  <div id="iprev"></div>
  <div class="sheet-actions"><button type="button" class="btn" data-act="close">Cancel</button><button type="button" class="btn primary" id="igo" disabled>Import</button></div>`);
  let result=null,t;
  const preview=()=>{
    const txt=$("#itext").value;const box=$("#iprev");const go=$("#igo");
    if(!txt.trim()){box.innerHTML="";go.disabled=true;go.textContent="Import";return}
    result=mapRows(txt,$("#irole").value.trim(),$("#isource").value.trim(),$("#iack").checked);
    if(result.error){box.innerHTML=`<p class="imp-sum err">${esc(result.error)}</p>`;go.disabled=true;return}
    const n=result.fresh.length;
    box.innerHTML=`<div class="imp-sum"><b>${n} new candidate${n===1?"":"s"} ready to import.</b>${result.dupes.length?` ${result.dupes.length} already in the tracker will be skipped.`:""}${result.blank?` ${result.blank} row${result.blank===1?"":"s"} without a name ignored.`:""}${result.over?" Only the first 300 rows are imported at a time.":""}${n?`<ul>${result.fresh.slice(0,5).map(c=>`<li>${esc(c.name)}${c.role?" – "+esc(c.role):""}</li>`).join("")}${n>5?`<li>and ${n-5} more</li>`:""}</ul>`:""}</div>`;
    go.disabled=!n;go.textContent=n?`Import ${n} candidate${n===1?"":"s"}`:"Import";
  };
  const later=()=>{clearTimeout(t);t=setTimeout(preview,250)};
  ["#itext","#irole","#isource"].forEach(s=>$(s).addEventListener("input",later));
  $("#iack").addEventListener("change",preview);
  $("#ifile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("#itext").value=String(r.result||"");preview()};r.onerror=()=>toast("Couldn’t read that file. Try saving it as CSV.");r.readAsText(f)});
  $("#igo").addEventListener("click",async()=>{
    if(!result||!result.fresh||!result.fresh.length)return;
    const go=$("#igo");go.disabled=true;let done=0;
    for(const c of result.fresh){
      go.textContent=`Importing ${done+1} of ${result.fresh.length}…`;
      if(!await persist(()=>store.save(c))){$("#iprev").innerHTML=`<p class="imp-sum err">Stopped after ${done} of ${result.fresh.length}. Fix the problem and import again; candidates already added will be skipped.</p>`;go.disabled=false;go.textContent="Try again";return}
      done++;
    }
    closeSheet();toast(`${done} candidate${done===1?"":"s"} imported`);
  });
}

/* ---------- copy ---------- */
async function copyFrom(id){
  const el=document.getElementById(id);if(!el)return;const text=el.value;
  const warn=id==="cbody"&&/\[[^\]]+\]/.test(text);
  try{await navigator.clipboard.writeText(text);toast(warn?"Copied. Some [brackets] still need filling in.":"Copied");return}catch(e){}
  try{el.focus();el.select();const ok=document.execCommand("copy");toast(ok?"Copied":"Select the text and copy it manually")}catch(e){toast("Select the text and copy it manually")}
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  if(e.target.closest("[data-stop]"))return;
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,id=b.dataset.id;const c=id?candidates.find(x=>x.id===id):null;
  if(act==="add")editSheet(null);
  else if(act==="import")importSheet();
  else if(act==="upload"){if(canWrite)$("#bulkFile").click()}
  else if(act==="open"&&c)editSheet(c);
  else if(act==="log"&&c)logSheet(c);
  else if(act==="compose"&&c){cs.cid=c.id;cs.tpl="";location.hash="#templates"}
  else if(act==="close")closeSheet();
  else if(act==="pstage"){pf.stage=b.dataset.v;renderPipeline()}
  else if(act==="pclosed"){pf.closed=!pf.closed;renderPipeline()}
  else if(act==="tstage"){tf.stage=b.dataset.v;renderTable()}
  else if(act==="tgroup"){tf.groups[b.dataset.v]=!tf.groups[b.dataset.v];b.setAttribute("aria-pressed",tf.groups[b.dataset.v]);renderTableBody()}
  else if(act==="tsort"){if(tf.sort===b.dataset.v)tf.dir=-tf.dir;else{tf.sort=b.dataset.v;tf.dir=1}renderTableBody()}
  else if(act==="export")exportCSV();
  else if(act==="tpl"){cs.tpl=b.dataset.v;renderTemplates()}
  else if(act==="copy")copyFrom(b.dataset.v);
  else if(act==="opened"){if(/\[[^\]]+\]/.test(($("#cbody")||{}).value||""))toast("Heads up: some [brackets] still need filling in before you send.");setTimeout(()=>{const s=$("#sentBtn");if(s){s.classList.add("primary");s.textContent="Sent it? Log it here"}},400)}
  else if(act==="sent"){const cc=candidates.find(x=>x.id===cs.cid);if(cc)logSheet(cc,cs.tpl)}
  else if(act==="del"&&c){
    if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Tap again to delete";return}
    if(await persist(()=>store.remove(c.id),"Candidate deleted"))closeSheet();
  }
});
$("#overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#overlay").hidden)closeSheet()});
function route(){const h=location.hash.replace("#","");view=["today","pipeline","table","templates"].includes(h)?h:"today";render();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);

/* ---------- bulk resume upload ---------- */
const RESUME_OK=/\.(pdf|docx|txt)$/i;
async function uploadFlow(fileList){
  if(!canWrite)return;
  let files=[...fileList].filter(f=>RESUME_OK.test(f.name));
  const skipped=fileList.length-files.length;
  if(!files.length){toast("Use PDF, Word (.docx) or text files.");return}
  if(files.length>25){toast("Up to 25 resumes at a time. Reading the first 25.");files=files.slice(0,25)}
  const known=new Map(candidates.filter(c=>na(c.email)).map(c=>[c.email.toLowerCase(),c.name]));
  const items=files.map(f=>({file:f,state:"wait",fields:null,found:0,include:true,name:"",dup:"",err:""}));
  const roles=[...new Set(candidates.map(x=>x.role).filter(Boolean))],owners=[...new Set(candidates.map(x=>x.owner).filter(Boolean))];
  let busy=true,adding=false;
  openSheet(`<div class="dh"><div><h2>Upload resumes</h2><p class="dh-sub">${files.length} file${files.length===1?"":"s"}${skipped?`, ${skipped} skipped (not PDF, Word or text)`:""}. Check the names, then add everyone in one go.</p></div><button type="button" class="xbtn" data-act="close" aria-label="Close">×</button></div>
    <div class="row2">
      <div class="field"><label for="u_role">Applied for</label><input type="text" id="u_role" list="u_roles" placeholder="e.g. Senior DevOps Cloud Engineer"><datalist id="u_roles">${roles.map(r=>`<option value="${esc(r)}">`).join("")}</datalist></div>
      <div class="field"><label for="u_owner">Owner</label><input type="text" id="u_owner" list="u_owners" value="${esc(me.name)}"><datalist id="u_owners">${owners.map(r=>`<option value="${esc(r)}">`).join("")}</datalist></div>
    </div>
    <div class="row2">
      <div class="field"><label for="u_source">Source</label><input type="text" id="u_source" value="Resume upload" list="u_sources"><datalist id="u_sources"><option value="Careers page"><option value="LinkedIn"><option value="Referral"><option value="Job board"></datalist></div>
      <div class="field"><label>&nbsp;</label><span class="tip" style="padding-top:8px">Everyone is added at Applied, with the acknowledgement due within 1 business day.</span></div>
    </div>
    <div class="up-list" id="uplist" aria-live="polite"></div>
    <div class="sheet-actions"><span class="tip" id="upsum"></span><span class="spacer"></span><button type="button" class="btn" data-act="close">Cancel</button><button type="button" class="btn primary" id="upgo" disabled>Reading resumes…</button></div>`);
  const list=$("#uplist");
  const rowHTML=(it,i)=>{
    const v=it.fields||{};const cur=[na(v.title),na(v.company)].filter(Boolean).join(" at ");
    let st="",cls="";
    if(it.state==="wait"){st="Waiting";cls=""}
    else if(it.state==="reading"){st="Reading";cls="busy"}
    else if(it.state==="error"){st=it.err;cls="err"}
    else if(it.dup){st="Already in tracker";cls="warn"}
    else{st=`${it.found} of 11 found`;cls=it.found>=7?"ok":"warn"}
    const done=it.state==="done";
    return `<div class="up-row${done&&it.include?"":" off"}">
      <input type="checkbox" data-i="${i}" ${done&&it.include?"checked":""} ${done?"":"disabled"} aria-label="Include ${esc(it.file.name)}">
      <div style="min-width:0"><input type="text" class="up-name${done&&it.include&&!it.name.trim()?" need":""}" data-i="${i}" value="${esc(it.name)}" placeholder="${done?"Name not found, type it here":it.state==="error"?"Not added":"Reading…"}" ${done?"":"disabled"} aria-label="Candidate name">
        <div class="up-meta"><span class="f">${esc(it.file.name)}</span>${na(v.email)?`<span>${esc(v.email)}</span>`:""}${cur?`<span>${esc(cur)}</span>`:""}${it.dup?`<span>Same email as ${esc(it.dup)}</span>`:""}</div></div>
      <div class="up-stat ${cls}">${esc(st)}</div></div>`;
  };
  const paint=()=>{
    if(!$("#uplist"))return;
    list.innerHTML=items.map(rowHTML).join("");
    const ready=items.filter(it=>it.state==="done"&&it.include);
    const unnamed=ready.filter(it=>!it.name.trim()).length;
    const go=$("#upgo");
    if(adding)return;
    if(busy){go.disabled=true;go.textContent=`Reading ${items.filter(it=>it.state==="done"||it.state==="error").length+1} of ${items.length}…`}
    else{go.disabled=!ready.length||!!unnamed;go.textContent=ready.length?`Add ${ready.length} candidate${ready.length===1?"":"s"}`:"Nothing to add"}
    const errs=items.filter(it=>it.state==="error").length,dups=items.filter(it=>it.dup).length;
    $("#upsum").textContent=busy?"":[unnamed?`${unnamed} need a name`:"",dups?`${dups} already in tracker (unticked)`:"",errs?`${errs} couldn’t be read`:""].filter(Boolean).join(", ");
  };
  list.addEventListener("change",e=>{const i=e.target.dataset.i;if(i==null||e.target.type!=="checkbox")return;items[+i].include=e.target.checked;paint()});
  list.addEventListener("input",e=>{const i=e.target.dataset.i;if(i==null||!e.target.classList.contains("up-name"))return;items[+i].name=e.target.value;e.target.classList.toggle("need",!e.target.value.trim());
    const ready=items.filter(it=>it.state==="done"&&it.include);const go=$("#upgo");go.disabled=!ready.length||ready.some(it=>!it.name.trim())});
  list.addEventListener("focusout",e=>{if(e.target.classList.contains("up-name"))paint()});
  paint();
  const seen=new Set();
  for(const it of items){
    if(!$("#uplist"))return;
    it.state="reading";paint();
    try{
      const x=await extractText(it.file);
      if(x.text.replace(/\s+/g,"").length<80){it.state="error";it.err="No readable text (scanned image?)"}
      else{
        const r=RP.parse(x.text,{largest:x.largest,links:x.links,fileName:it.file.name});
        it.fields=r.fields;it.found=r.found.length;it.name=na(r.fields.name);it.state="done";
        const em=na(r.fields.email).toLowerCase();
        if(em&&known.has(em)){it.dup=known.get(em);it.include=false}
        else if(em&&seen.has(em)){it.dup="another file in this upload";it.include=false}
        if(em)seen.add(em);
      }
    }catch(e){it.state="error";it.err=e&&e.message==="type"?"Unsupported file type":"Couldn’t open this file"}
    paint();
  }
  busy=false;paint();
  $("#upgo").addEventListener("click",async()=>{
    const ready=items.filter(it=>it.state==="done"&&it.include&&it.name.trim());if(!ready.length)return;
    adding=true;const go=$("#upgo");go.disabled=true;
    const role=$("#u_role").value.trim(),owner=$("#u_owner").value.trim(),source=$("#u_source").value.trim();
    let done=0,noFile=0;
    for(const it of ready){
      go.textContent=`Adding ${done+1} of ${ready.length}…`;
      const v=it.fields;
      const c={id:uid(),name:it.name.trim(),email:na(v.email),phone:na(v.phone),linkedin:na(v.linkedin),role,stage:"Applied",owner,source,next:addBiz(1),notes:"",
        profile:Object.fromEntries(PROFILE.map(([k])=>[k,v[k]||"N/A"])),screen:{},interviews:[],
        history:[{d:today(),t:"Added from resume upload ("+it.file.name+")"+(me.name?" by "+me.name:"")}]};
      if(/\.pdf$/i.test(it.file.name)&&assetsApi){try{const up=await assetsApi.upload(it.file);c.resume={id:up.id,name:it.file.name,size:up.sizeBytes}}catch(e){noFile++}}
      if(!await persist(()=>store.save(c))){go.disabled=false;adding=false;go.textContent="Try again";$("#upsum").textContent=`Stopped after ${done} of ${ready.length}.`;ready.slice(0,done).forEach(x=>x.include=false);return}
      done++;
    }
    closeSheet();toast(`${done} candidate${done===1?"":"s"} added${noFile?`; ${noFile} resume file${noFile===1?"":"s"} couldn’t be attached`:""}`);
  });
}
$("#bulkFile").addEventListener("change",e=>{const f=e.target.files;if(f&&f.length)uploadFlow(f);e.target.value=""});
(function(){
  let depth=0;const dz=$("#dropzone");
  const hasFiles=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes("Files");
  document.addEventListener("dragenter",e=>{if(!hasFiles(e)||!canWrite||!$("#overlay").hidden)return;depth++;dz.hidden=false});
  document.addEventListener("dragleave",e=>{if(!hasFiles(e))return;depth=Math.max(0,depth-1);if(!depth)dz.hidden=true});
  document.addEventListener("dragover",e=>{if(hasFiles(e))e.preventDefault()});
  document.addEventListener("drop",e=>{if(!hasFiles(e))return;e.preventDefault();depth=0;dz.hidden=true;
    if(!canWrite)return;if(!$("#overlay").hidden){toast("Close the open panel first, then drop the resumes.");return}
    uploadFlow(e.dataTransfer.files)});
})();

/* ---------- theme ---------- */
function currentTheme(){const a=document.documentElement.getAttribute("data-theme");if(a)return a;return window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}
function syncThemeBtn(){const b=$("#themeBtn");if(!b)return;const next=currentTheme()==="dark"?"light":"dark";b.setAttribute("aria-label","Switch to "+next+" mode");b.title="Switch to "+next+" mode"}
$("#themeBtn").addEventListener("click",()=>{const next=currentTheme()==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",next);ls("ct-theme",next);syncThemeBtn()});
syncThemeBtn();

/* ---------- start ---------- */
function start(s){
  store=s;
  const timer=setTimeout(()=>{if(!loaded)notice("Can’t reach the shared tracker yet. Your list will appear once the connection returns.");else notice("This list may be out of date while the connection is slow.")},10000);
  store.subscribe((list,meta)=>{
    candidates=list.filter(c=>c&&c.name).map(normalize);loaded=true;
    if(!meta||!meta.fromCache){clearTimeout(timer);notice("")}
    if(!$("#overlay").hidden)return renderBackgroundOnly();
    render();
  },err=>{clearTimeout(timer);loaded=true;notice(err&&err.code==="revoked"?"This tracker is no longer available to you.":"The shared tracker stopped responding. Reload the page to reconnect.");render()});
}
function renderBackgroundOnly(){
  const b=buckets();const n=b.late.length+b.due.length;const dc=$("#dueCount");dc.textContent=n;dc.hidden=!n;
  if(view==="today")renderToday(b);else if(view==="pipeline")renderPList();else if(view==="table")renderTableBody();
}
route();
(async()=>{
  const C=window.claude;let db=null,user=null;
  if(C&&typeof C.use==="function"){
    try{[db,user]=await Promise.all([C.use("db"),C.use("user")])}catch(e){}
    C.use("assets").then(a=>{assetsApi=a||null}).catch(()=>{});
    C.use("downloads").then(d=>{downloadsApi=d||null;if(d&&view==="table")renderTable()}).catch(()=>{});
  }
  if(db){
    if(user){try{const w=await user.can("data.write");if(w===false)canWrite=false}catch(e){}}
    start(makeDbStore(db));
  }else{
    notice("Shared storage isn’t available in this view, so candidates are saved on this device only. Open the tracker from its claude.ai link to share it with your team.");
    start(makeLocalStore());
  }
})();
})();
</script>
